# Generic image: root is found via root=UUID= on the vendor_boot cmdline.
hostonly="no"
compress="gzip"
# Root storage is built into the kernel (=y); the gadget modules are not.
add_drivers+=" configfs libcomposite usb_f_rndis dwc3 dwc3-qcom "
# The Adreno driver is built-in and probes during the initramfs, before the
# real root (which carries the firmware payload) is mounted.  Without these
# the GPU fails its first fw request and GNOME ends up on llvmpipe.
install_items+=" /usr/lib/firmware/qcom/a740_sqe.fw /usr/lib/firmware/qcom/gmu_gen70200.bin /usr/lib/firmware/qcom/a740_zap.mdt /usr/lib/firmware/qcom/a740_zap.b00 /usr/lib/firmware/qcom/a740_zap.b01 /usr/lib/firmware/qcom/a740_zap.b02 "
