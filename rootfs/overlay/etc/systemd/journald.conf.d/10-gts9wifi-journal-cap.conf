# The rootfs partition on this port is 3.6 GB.  An uncapped systemd journal
# grew to 778 MB during bring-up, filled the filesystem, and left lightdm in a
# permanent crash loop: the session could not write ~/.Xauthority, exited 1, and
# systemd restarted it forever - which looks exactly like a black screen after
# the Samsung logo.  Cap the journal so a long debugging session cannot do that
# again.
[Journal]
SystemMaxUse=64M
RuntimeMaxUse=32M
SystemMaxFileSize=16M
