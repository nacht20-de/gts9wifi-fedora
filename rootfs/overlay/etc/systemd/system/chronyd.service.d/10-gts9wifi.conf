# chronyd ships heavy namespace sandboxing; on this kernel systemd fails
# the setup (226/NAMESPACE) and the RTC-less tablet never gets time sync.
# The wrong clock then breaks rpm signature checks and TLS.  Disable the
# sandbox pieces this kernel cannot provide and keep the caps chronyd needs.
[Service]
ProtectSystem=false
ProtectHome=false
PrivateTmp=false
PrivateDevices=false
PrivateIPC=false
PrivateNetwork=false
PrivateUsers=false
NoNewPrivileges=false
ProtectClock=false
ProtectHostname=false
ProtectKernelLogs=false
ProtectKernelModules=false
ProtectKernelTunables=false
ProtectControlGroups=false
RestrictAddressFamilies=
RestrictNamespaces=
RestrictRealtime=false
RestrictSUIDSGID=false
MemoryDenyWriteExecute=false
LockPersonality=false
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_RAW CAP_SYS_TIME CAP_CHOWN CAP_DAC_OVERRIDE CAP_SETGID CAP_SETUID
AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_NET_RAW CAP_SYS_TIME
RuntimeDirectory=chrony
ExecStartPre=/usr/bin/mkdir -p /var/lib/chrony /run/chrony
