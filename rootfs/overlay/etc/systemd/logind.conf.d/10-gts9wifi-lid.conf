#
# The X710 book cover is a direct SW_LID input.  A tablet has no docking
# topology to discover after boot/resume, so logind's 30-second lid holdoff
# only makes a valid second close look intermittent.  Treat the cover
# consistently on battery, external power and at the greeter.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
HoldoffTimeoutSec=0
