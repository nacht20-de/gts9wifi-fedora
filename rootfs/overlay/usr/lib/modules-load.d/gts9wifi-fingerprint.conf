# gts9wifi fingerprint stack.
#
# Both drivers are out-of-tree and nothing else loads them, so a plain boot
# otherwise has no /dev/esfp0 (the under-display EgisTec EL721 reader) and no
# /dev/k250a (the Samsung K250A secure element the reader talks to) -- and
# fprintd reports "No devices available".
#
# Neither probe needs the SPU or the TEE: the drivers only register their
# character devices, and the secure session (sp_keymaster, StrongBox) starts
# when the reader is opened.  Bringing the secure side up is what
# gts9wifi-spu-up does, and it is deliberately not run at boot.
egis_el721
snvm
