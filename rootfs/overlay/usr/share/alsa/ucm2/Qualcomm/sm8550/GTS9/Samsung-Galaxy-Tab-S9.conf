Syntax 4

# UCM profile for the Galaxy Tab S9 (SM-X710).
#
# Unlike the SM8550 reference boards this tablet has no WSA/WCD codecs: the four
# Cirrus CS35L45 amplifiers hang off PRIMARY MI2S and the microphones are DMICs
# straight into the LPASS VA macro.  The routing therefore has nothing in common
# with the HDK profile and is spelled out here.

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8550/GTS9/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	# Per-amplifier hardware volume.  457 is 0 dB, 428 is about -7.25 dB.
	#
	# 428 rather than 0 dB is deliberate.  The Cirrus speaker-protection
	# firmware now ships with the image (cirrus/cs35l45-dsp1-spk-prot.wmfw
	# + .bin, staged by fetch-local-assets.sh), so the DSP limiter runs and
	# bounds excursion in hardware - that is what makes anything above the
	# old -19 dB safe at all.
	#
	# The 7.25 dB still held back is because mainline's wm_adsp loads exactly
	# one coefficient file (wm_adsp_request_firmware_files() requests .wmfw
	# and .bin and nothing else), while Samsung ships the speaker
	# characterisation separately as cs35l45-dsp1-spk-prot-calib.bin with
	# deploy_group "left_cal" (the tuning group in .bin is "left").  That
	# group is therefore not loaded and CAL_R/CAL_STATUS read 0, so the
	# limiter runs on the tuning's nominal speaker parameters rather than
	# measured ones.  Do not go to 0 dB until that is understood - it was
	# verified by ear at 428, not characterised.
	cset "name='Front Left Digital PCM Volume' 428"
	cset "name='Front Right Digital PCM Volume' 428"
	cset "name='Rear Left Digital PCM Volume' 428"
	cset "name='Rear Right Digital PCM Volume' 428"
	cset "name='Front Left Analog PCM Volume' 3"
	cset "name='Front Right Analog PCM Volume' 3"
	cset "name='Rear Left Analog PCM Volume' 3"
	cset "name='Rear Right Analog PCM Volume' 3"
	# Each amplifier takes its audio from ASP_RX1 (the MI2S data line).
	cset "name='Front Left DACPCM Source' ASP_RX1"
	cset "name='Front Right DACPCM Source' ASP_RX1"
	cset "name='Rear Left DACPCM Source' ASP_RX1"
	cset "name='Rear Right DACPCM Source' ASP_RX1"
]

Include.card-init.File "/lib/card-init.conf"
