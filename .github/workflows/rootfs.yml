name: Fedora rootfs

on:
  workflow_dispatch:
    inputs:
      fedora_release:
        description: "Fedora release to build against"
        default: "44"
        type: string
      desktop:
        description: "gnome = release image (Workstation + device stack + firmware + kernel); core = headless debug image"
        default: "gnome"
        type: choice
        options: [gnome, core]
      kernel_rpm_url:
        description: "Kernel RPM URL — must be the same release users flash as the TWRP boot bundle"
        default: "https://github.com/nacht20-de/gts9wifi-fedora/releases/download/kernel-7.2.0-rc3-gts9wifi-3/linux-gts9wifi-7.2.0-0.2.rc3.fc44.aarch64.rpm"
        type: string
      kernel_sha256:
        description: "sha256 of the RPM"
        default: "a587a3b029226161eb38ae763b9e6c5a13b0581715723dc695f7c5fc004a0755"
        type: string
      firmware_url:
        description: "Device firmware payload (extracted from the stock partitions)"
        default: "https://github.com/nacht20-de/gts9wifi-fedora/releases/download/kernel-7.2.0-rc3-gts9wifi-2/firmware-samsung-gts9wifi-v2.tar.gz"
        type: string
      firmware_sha256:
        description: "sha256 of the firmware payload"
        default: "30cace40556fdaf1577c76bedc1b1a6236f4acc23e9300253b3834fa7ed4bab5"
        type: string
      release_tag:
        description: "Release tag to (re)publish the finished assets to, e.g. rootfs-f44-gnome-3 (empty = skip publishing)"
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-rootfs:
    # Native arm64 like the pmOS kernel workflow — the rootfs build (dnf
    # installroot + three meson builds) runs natively inside a Fedora
    # aarch64 container, no qemu involved.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned firmware payload and kernel RPM
        run: |
          mkdir -p _ci
          curl -sfL "${{ inputs.firmware_url }}" -o _ci/firmware.tar.gz
          echo "${{ inputs.firmware_sha256 }}  _ci/firmware.tar.gz" | sha256sum -c -
          curl -sfL "${{ inputs.kernel_rpm_url }}" -o _ci/kernel.rpm
          echo "${{ inputs.kernel_sha256 }}  _ci/kernel.rpm" | sha256sum -c -

      - name: Build rootfs in Fedora aarch64 container
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e FEDORA_RELEASE='${{ inputs.fedora_release }}' \
            -e GTS9_DESKTOP='${{ inputs.desktop }}' \
            -e GTS9_USER='fedora' \
            -e FIRMWARE_TARBALL=/work/_ci/firmware.tar.gz \
            -e KERNEL_RPM=/work/_ci/kernel.rpm \
            quay.io/fedora/fedora:${{ inputs.fedora_release }} \
            ./rootfs/build-rootfs.sh
          # The container writes out/ as root; hand it to the runner user
          # so the checksum step below can add SHA256SUMS next to it.
          sudo chown -R "$(id -u):$(id -g)" out

      - name: Checksum
        run: |
          cd out && sha256sum *.tar.gz rootfs-manifest.txt > SHA256SUMS && cat SHA256SUMS

      # The runner uploads straight to the release: there is no API to turn an
      # Actions artifact into a release asset, and doing it from here avoids a
      # ~2 GB download/upload round-trip through a personal machine.  --clobber
      # replaces same-named assets, so the tag keeps a stable asset set.
      - name: Publish assets to the named release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ inputs.release_tag }}
        run: gh release upload "$REL" --clobber out/*.tar.gz out/rootfs-manifest.txt out/SHA256SUMS

      - name: Upload rootfs tarball
        uses: actions/upload-artifact@v4
        with:
          name: gts9wifi-fedora-${{ inputs.desktop }}-rootfs-f${{ inputs.fedora_release }}
          path: |
            out/*.tar.gz
            out/rootfs-manifest.txt
            out/SHA256SUMS
          if-no-files-found: error
