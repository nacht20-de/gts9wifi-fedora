name: Kernel build

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Device firmware payload (GPU/ADSP blobs for the initramfs)"
        default: "https://github.com/nacht20-de/gts9wifi-fedora/releases/download/kernel-7.2.0-rc3-gts9wifi-2/firmware-samsung-gts9wifi-v2.tar.gz"
        type: string
      firmware_sha256:
        description: "sha256 of the firmware payload"
        default: "30cace40556fdaf1577c76bedc1b1a6236f4acc23e9300253b3834fa7ed4bab5"
        type: string

env:
  KVER: 7.2.0-rc3-gts9wifi

jobs:
  build-kernel:
    # Native arm64, full LLVM toolchain, same model as the pmOS kernel build.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build kernel RPM, initramfs, boot bundle and TWRP zip
        run: |
          docker run --rm \
            -e KVER \
            -e FIRMWARE_URL='${{ inputs.firmware_url }}' \
            -e FIRMWARE_SHA256='${{ inputs.firmware_sha256 }}' \
            -v "$PWD:/work" -w /work \
            quay.io/fedora/fedora:44 \
            bash -lc '
              set -euxo pipefail
              dnf -y install make gcc clang lld llvm bc flex bison perl \
                  openssl openssl-devel elfutils-libelf-devel python3 tar xz \
                  zstd rpm-build ccache dtc findutils dwarves dracut \
                  cpio lz4 iproute >/dev/null

              # --- kernel ---
              mkdir -p /tmp/kcache
              if [ ! -f /tmp/kcache/linux-7.2-rc3.tar.gz ]; then
                curl -sfL https://git.kernel.org/torvalds/t/linux-7.2-rc3.tar.gz \
                  -o /tmp/kcache/linux-7.2-rc3.tar.gz
              fi
              tar xf /tmp/kcache/linux-7.2-rc3.tar.gz
              cd linux-7.2-rc3
              bash /work/kernel/prepare.sh .
              echo "-gts9wifi" > localversion-gts9wifi
              cd ..
              mv linux-7.2-rc3 linux-prepared
              tar czf linux-prepared.tar.gz linux-prepared
              rm -rf linux-prepared

              mkdir -p ~/rpmbuild/SOURCES out-kernel out-bundle out-twrp
              cp linux-prepared.tar.gz ~/rpmbuild/SOURCES/
              rpmbuild -bb --define "kversion 7.2.0-rc3" /work/kernel/kernel.spec
              cp ~/rpmbuild/RPMS/aarch64/*.rpm out-kernel/

              # --- initramfs: install the RPM into the container, dracut ours ---
              dnf -y install out-kernel/*.rpm
              # The Adreno driver is built-in and probes inside the initramfs;
              # stage the device GPU firmware so the first fw request succeeds
              # (gts9wifi.conf install_items pulls these into the image).
              curl -sfL "$FIRMWARE_URL" -o /tmp/fw.tar.gz
              echo "$FIRMWARE_SHA256  /tmp/fw.tar.gz" | sha256sum -c -
              tar xzf /tmp/fw.tar.gz -C /
              cp -a /work/boot/dracut/90gts9wifi-usbnet /usr/lib/dracut/modules.d/
              cp /work/boot/dracut/dracut.conf.d/gts9wifi.conf /usr/lib/dracut/dracut.conf.d/
              dracut --kver "$KVER" --force /tmp/initramfs.img

              # --- boot bundle ---
              bash /work/boot/build-bundle.sh \
                --vmlinuz /boot/vmlinuz-"$KVER" \
                --dtb "/boot/dtbs-7.2.0-rc3-gts9wifi/qcom/sm8550-samsung-gts9wifi.dtb" \
                --initramfs /tmp/initramfs.img \
                --cmdline /work/boot/cmdline.txt \
                --bootconfig /work/boot/bootconfig.txt \
                --out out-bundle

              # --- TWRP zip ---
              python3 /work/tools/make-twrp-zip.py out-bundle \
                out-twrp/gts9wifi-fedora-"$KVER".zip --project /work
            '

      - name: Upload kernel RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-gts9wifi-rpm
          path: out-kernel/*.rpm
          if-no-files-found: error

      - name: Upload boot bundle images
        uses: actions/upload-artifact@v4
        with:
          name: gts9wifi-boot-bundle
          path: |
            out-bundle/*.img
            out-bundle/SHA256SUMS
            out-bundle/BUILD-METADATA.txt
          if-no-files-found: error

      - name: Upload TWRP flash zip
        uses: actions/upload-artifact@v4
        with:
          name: gts9wifi-twrp-zip
          path: out-twrp/*.zip
          if-no-files-found: error
