name: Kernel build

on:
  workflow_dispatch:

jobs:
  build-kernel:
    # Native arm64, full LLVM toolchain, same model as the pmOS kernel build.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build kernel RPM in Fedora aarch64 container
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            quay.io/fedora/fedora:44 \
            bash -lc '
              set -euxo pipefail
              dnf -y install make gcc clang lld llvm bc flex bison perl \
                  openssl-devel elfutils-libelf-devel python3 tar xz zstd \
                  rpm-build ccache dtc findutils >/dev/null

              # Fetch the kernel tarball (cached by hash across runs).
              mkdir -p /tmp/kcache
              if [ ! -f /tmp/kcache/linux-7.2.0-rc3.tar.gz ]; then
                curl -sfL https://git.kernel.org/torvalds/t/linux-7.2.0-rc3.tar.gz \
                  -o /tmp/kcache/linux-7.2.0-rc3.tar.gz
              fi

              # Prepare the tree exactly like the pmOS APKBUILD.
              tar xf /tmp/kcache/linux-7.2.0-rc3.tar.gz
              cd linux-7.2.0-rc3
              /work/kernel/prepare.sh .
              # Distinguish our builds from the pmOS kernel on the same device.
              echo "-gts9wifi1" > localversion-gts9wifi
              cd ..

              # Feed the prepared tree to rpmbuild as Source0.
              mv linux-7.2.0-rc3 linux-prepared
              tar czf linux-prepared.tar.gz linux-prepared
              mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/RPMS
              cp linux-prepared.tar.gz ~/rpmbuild/SOURCES/
              rpmbuild -bb --define "kversion 7.2.0-rc3" /work/kernel/kernel.spec

              cp ~/rpmbuild/RPMS/aarch64/*.rpm /work/out-kernel/ 2>/dev/null || \
                { mkdir -p /work/out-kernel && cp ~/rpmbuild/RPMS/aarch64/*.rpm /work/out-kernel/; }
            '
        env:
          CCACHE_DIR: /tmp/.ccache

      - name: Upload kernel RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-gts9wifi-rpm
          path: out-kernel/*.rpm
          if-no-files-found: error
